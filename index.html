<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <title>Been-go! — List it. It's been gone.</title>
    <meta name="description" content="Been-go! is an invite-only marketplace. List what you have, sell to people you trust, get paid straight to your bank." />
    <meta name="robots" content="noindex, nofollow" />

    <meta name="theme-color" content="#f9fafb" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Been-go!" />

    <!--
      Theme before first paint. If this ran in React instead, every load
      would show one frame of the wrong theme before correcting itself,
      which is far more jarring than either theme on its own.
      Light is the default; a blocked script leaves the page light,
      which is the same thing.
    -->
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('beengo-theme');
          var dark = saved === 'dark';
          document.documentElement.classList.toggle('dark', dark);
          document.documentElement.style.colorScheme = dark ? 'dark' : 'light';
          if (dark) {
            document.querySelector('meta[name="theme-color"]')
              .setAttribute('content', '#0f172a');
          }
        } catch (e) {
          /* Light is the default, and the default is what is already here. */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
