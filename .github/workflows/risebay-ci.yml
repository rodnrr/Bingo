name: RiseBay CI

on:
  push:
    paths: ['app/**', '.github/workflows/risebay-ci.yml']
  pull_request:
    paths: ['app/**', '.github/workflows/risebay-ci.yml']

permissions:
  contents: read

concurrency:
  group: risebay-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    name: Typecheck & Build
    defaults:
      run:
        working-directory: app

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: app/package-lock.json

      - run: npm ci

      - run: npm run typecheck

      - run: npm run lint

      # The build only needs these to exist — the client reads them at
      # runtime from the host's environment, so CI can use placeholders
      # rather than carrying real project values.
      - run: npm run build
        env:
          VITE_SUPABASE_URL: https://placeholder.supabase.co
          VITE_SUPABASE_ANON_KEY: placeholder-anon-key
          VITE_APP_ENV: production
